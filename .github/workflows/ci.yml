name: CI Network Check, Linting, and Docker Build

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck Linter
        run: shellcheck database_connect.sh

      - name: Make Scripts Executable
        run: chmod +x database_connect.sh

      - name: Run Database Connection Test
        env:
          DATABASE_PASS: ${{ secrets.DB_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./database_connect.sh

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-lab-app:latest
